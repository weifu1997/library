name: CI

# What this runs on every push and PR:
#   1. lock-check     — fast fail if uv.lock drifts from pyproject.toml
#   2. backend-tests  — pytest on the full tests/ tree, three OSes
#   3. frontend-build — desktop/ TypeScript typecheck + Vite build
#   4. tauri-check    — cargo check on the Rust shell (no bundling)
#   5. docker-build   — `docker build .` so Dockerfile rot surfaces on PRs
#
# The release pipeline (release.yml) does the heavy bundling on tag pushes;
# CI only proves the code compiles and tests pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when new commits land on the same ref. Saves CI
# minutes on rapid pushes; the latest commit is what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap early gate: `uv lock --locked` fails in seconds if uv.lock is out of
  # sync with pyproject.toml — the drift that shipped an untested dep set in a
  # prior release. Keeps the heavier jobs from masking a lock mismatch.
  lock-check:
    name: uv.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --locked

  backend-tests:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (locked)
        run: uv sync --locked --extra dev

      - name: Run lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest tests/ -v

  frontend-build:
    name: desktop tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  tauri-check:
    name: cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-targets: false

      # Tauri's webkit dep on Linux needs system libraries; Windows / macOS
      # ship them with the SDK. Keep this in lockstep with what release.yml
      # installs for `tauri build`.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            file \
            libgdk-pixbuf2.0-bin \
            libglib2.0-bin \
            libgtk-3-bin \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            patchelf \
            shared-mime-info \
            squashfs-tools

      - run: cargo check --all-targets

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build (no push) with the same mirror overrides release.yml uses so the
      # GitHub runner (outside mainland China) doesn't route through the tuna
      # mirror. This validates the linux/amd64 build only (load: true implies a
      # single arch); the release builds linux/amd64,linux/arm64, so an
      # arm64-only regression (e.g. a pinned dep with no aarch64 wheel) still
      # surfaces at release time, not here. The GHA layer cache keeps runs fast.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: library:ci
          build-args: |
            APT_MIRROR=
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
