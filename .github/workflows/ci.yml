name: CI

# What this runs on every push and PR:
#   1. lock-check     — fast fail if uv.lock drifts from pyproject.toml
#   2. backend-tests  — pytest on the full tests/ tree, three OSes
#   3. frontend-build — frontend/ TypeScript typecheck + Vite build
#   4. contract       — regenerate OpenAPI + TS types and fail on drift
#
# CI only proves the code compiles and tests pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when new commits land on the same ref. Saves CI
# minutes on rapid pushes; the latest commit is what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap early gate: `uv lock --locked` fails in seconds if uv.lock is out of
  # sync with pyproject.toml — the drift that shipped an untested dep set in a
  # prior release. Keeps the heavier jobs from masking a lock mismatch.
  lock-check:
    name: uv.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --locked

  backend-tests:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (locked)
        run: uv sync --locked --extra dev

      - name: Run lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest tests/ -v

  frontend-build:
    name: frontend tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  contract:
    name: OpenAPI + TS contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (locked)
        run: uv sync --locked --extra dev

      - name: Export OpenAPI
        run: uv run python -m library.openapi_export

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (locked)
        run: npm --prefix frontend ci

      - name: Generate TypeScript types
        run: npm --prefix frontend run gen:api

      - name: Fail on contract drift
        run: git diff --exit-code -- openapi/openapi.json frontend/src/types/generated/openapi.d.ts src/library/schemas
