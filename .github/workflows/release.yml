name: Release

# Triggers on release tags such as v0.2.0 and prerelease tags such as
# v0.2.4-rc.1.
#
# What it produces:
#   - A multi-arch Docker image pushed to ghcr.io/<owner>/library and
#     tagged with the version and latest.
#
# The publish job is the only job that mutates the GitHub Release, which
# avoids draft-release races.

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # Fast fail-first gate: a lock/pyproject mismatch (the kind that broke a
  # prior release) surfaces in seconds here instead of after the expensive
  # multi-arch Docker build has already run.
  lock-check:
    name: uv.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --locked

  docker:
    name: Docker image (multi-arch)
    needs: lock-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/library
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.tag, '-')) }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_MIRROR=
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish GitHub Release
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Write release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-changelog.md

          if [ ! -s release-changelog.md ] && [[ "$TAG" == *-* ]]; then
            awk '
              $0 ~ "^## Unreleased([[:space:]]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-changelog.md
          fi

          {
            echo "## Highlights"
            echo
            if [ -s release-changelog.md ]; then
              awk '
                /^### / { next }
                { print }
              ' release-changelog.md
            fi
            cat <<EOF

          ## Artifacts

          Docker image: \`ghcr.io/${{ github.repository_owner }}/library:$TAG\` (linux/amd64, linux/arm64)
          EOF
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          release_flags=(--latest)
          if [[ "$TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            --title "Library $TAG" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
