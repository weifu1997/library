# syntax=docker/compose-spec:1.0
# Library dev stack: api + worker + Postgres + MinIO.
#
# Bring up:    docker compose up -d
# Logs:        docker compose logs -f api worker
# Reset:       docker compose down -v   # drops volumes (postgres, minio, /data)
#
# .env (next to this file) must define LLM_DEFAULT_API_KEY at minimum.
# Other LLM_* overrides are read by Settings via env passthrough.
# Published ports bind to 127.0.0.1 by default. To expose the API or
# MinIO console on a LAN, change the host bindings deliberately and set
# LIBRARY_API_TOKEN for the API service.

name: library

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"  # web console (optional, useful for local inspection)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the bucket on first boot, then exits 0.
  # Idempotent — `mb --ignore-existing` is a noop on subsequent runs.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/library &&
      echo 'bucket ready'
      "
    restart: "no"

  # One migration owner runs all DDL before API/worker replicas start.
  db-prepare:
    build:
      context: .
      dockerfile: Dockerfile
    image: library:dev
    depends_on:
      postgres:
        condition: service_healthy
    command: ["library-db-prepare"]
    environment:
      LIBRARY_HOME: /data
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql+asyncpg://library:library@postgres:5432/library
      RUNTIME_SCHEMA_BOOTSTRAP_ENABLED: "false"
    volumes:
      - margdata:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: library:dev
    depends_on:
      postgres:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      LIBRARY_HOME: /data
      APP_ENV: ${APP_ENV:-dev}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      BUILD_ID: ${BUILD_ID:-local}
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql+asyncpg://library:library@postgres:5432/library
      POSTGRES_PREPARED_STATEMENT_CACHE_SIZE: ${POSTGRES_PREPARED_STATEMENT_CACHE_SIZE:-100}
      RUNTIME_SCHEMA_BOOTSTRAP_ENABLED: "false"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: library
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Worker runs as its own service; disable the in-process runner.
      WORKER_ENABLED: "false"
      # LLM credentials come from .env — never bake them into the image.
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-openai}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:?set LLM_DEFAULT_API_KEY in .env}
      LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-}
      LIBRARY_API_TOKEN: ${LIBRARY_API_TOKEN:-}
    volumes:
      - margdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: library:dev
    depends_on:
      api:
        condition: service_healthy
    command: ["library-worker", "--log-level", "INFO"]
    environment:
      LIBRARY_HOME: /data
      APP_ENV: ${APP_ENV:-dev}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      BUILD_ID: ${BUILD_ID:-local}
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql+asyncpg://library:library@postgres:5432/library
      POSTGRES_PREPARED_STATEMENT_CACHE_SIZE: ${POSTGRES_PREPARED_STATEMENT_CACHE_SIZE:-100}
      RUNTIME_SCHEMA_BOOTSTRAP_ENABLED: "false"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: library
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-openai}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:?set LLM_DEFAULT_API_KEY in .env}
      LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-}
    volumes:
      - margdata:/data

volumes:
  pgdata:
  miniodata:
  margdata:
